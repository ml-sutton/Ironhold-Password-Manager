services:
  # dashboard:
  #   networks:
  #     - backend
  # proxy: 
  #   networks:
  #     - client
  #     - backend
  api:
    container_name: api
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      GIN_MODE: release
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
        restart: true
  database: 
    image: timescale/timescaledb-ha:pg17
    container_name: database
    env_file: .env
    restart: always
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DATABASE_NAME}"] 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 
    deploy:
      resources:
        reservations:
          cpus: '0.75'
          memory: 200M
        limits:
          cpus: "0.75"
          memory: 200M
    volumes:
      - /etc/localtime:/etc/localtime:ro 
      - ./scripts/database:/docker-entrypoint-initdb.d

networks:
  client:
    driver: bridge
  backend:
    driver: bridge
    internal: true